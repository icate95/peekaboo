<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Peekaboo</title>
<style>
  :root{
    --working:#3ddc97;
    --waiting:#ffb547;
    --replied:#5eb3ff;
    --sleeping:#7d8590;
    --crowded:#ff6b8a;

    --panel:rgba(22,24,32,.82);
    --line:rgba(255,255,255,.10);
    --ink:#e9edf4;
    --dim:#9aa3b2;
    --faint:#6f7785;
    --radius:13px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;

    /* light body tinted by state, like the reference stickers */
    --fill-working:#ddf8ea;
    --fill-waiting:#fff1d8;
    --fill-replied:#dcedff;
    --fill-sleeping:#e7e9ee;
    --fill-crowded:#ffe1e9;
    --outline:#22262e;
    --blush:#ffa3bb;
  }

  /* pixel theme: hard edges, brighter colours, monospace */
  body[data-theme=pixel]{
    --panel:rgba(16,18,26,.90);
    --radius:3px;
    --font:"SF Mono",Menlo,monospace;
    --working:#4ef58c; --waiting:#ffc632; --replied:#5ec8ff; --sleeping:#79808d;
  }
  /* minimal theme: no face, everything quieter */
  body[data-theme=minimal]{
    --panel:rgba(18,19,24,.72);
    --line:rgba(255,255,255,.07);
    --working:#8fd9b6; --waiting:#e2c08d; --replied:#9dc3e6; --sleeping:#8a8f98;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:transparent;overflow:hidden}
  body{
    font:13px/1.45 var(--font);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
    padding:10px;gap:8px;
    user-select:none;cursor:default;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    backdrop-filter:blur(22px) saturate(150%);
  }

  /* -------------------------------------------------------------- drag bar */
  #grip{
    flex:0 0 auto;
    display:flex;align-items:center;gap:7px;
    padding:5px 8px 5px 10px;
  }
  #grip .ttl{font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--dim)}
  #grip .spacer{flex:1}
  #tally{display:flex;gap:7px;font-size:11px;font-variant-numeric:tabular-nums}
  #tally span{display:flex;align-items:center;gap:3px}
  #tally i{width:6px;height:6px;border-radius:50%;background:currentColor;font-style:normal}
  .t-working{color:var(--working)}
  .t-waiting{color:var(--waiting)}
  .t-replied{color:var(--replied)}
  .t-sleeping{color:var(--sleeping)}

  .ico{
    cursor:pointer;color:var(--faint);
    padding:2px 5px;border-radius:5px;line-height:1;font-size:13px;
    transition:color .15s,background .15s;
  }
  #gear{font-size:16px;padding:1px 5px}
  #dnd{font-size:15px}
  .ico:hover{color:var(--ink);background:rgba(255,255,255,.09)}
  .ico.on{color:var(--waiting)}
  #close:hover{color:#ff6b6b}

  /* -------------------------------------------------------------- settings */
  #panel{
    flex:0 0 auto;padding:10px 11px;display:none;
    max-height:44vh;overflow-y:auto;
  }
  #panel.open{display:block}
  .sec{font-size:10px;font-weight:700;letter-spacing:.6px;color:var(--faint);
       text-transform:uppercase;margin:9px 0 5px}
  .sec:first-child{margin-top:0}
  .row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11.5px}
  .row label{flex:1;color:var(--dim);cursor:pointer}
  .row select{
    background:rgba(255,255,255,.07);border:1px solid var(--line);
    color:var(--ink);border-radius:6px;padding:2px 4px;font:inherit;font-size:11px;
    max-width:150px;
  }
  .hint{font-size:10px;color:var(--faint);padding:1px 0 3px;line-height:1.4}
  .row input[type=range]{
    flex:0 0 88px;accent-color:var(--working);height:14px;cursor:pointer;
  }
  .val{flex:0 0 34px;text-align:right;font-size:10.5px;color:var(--dim);
       font-variant-numeric:tabular-nums}
  .row input[type=number]{
    width:52px;background:rgba(255,255,255,.07);border:1px solid var(--line);
    color:var(--ink);border-radius:6px;padding:2px 6px;font:inherit;font-size:11px;
    text-align:right;
  }
  .sw{
    position:relative;width:30px;height:17px;flex:0 0 auto;
    background:rgba(255,255,255,.13);border-radius:20px;cursor:pointer;
    transition:background .18s;
  }
  .sw::after{
    content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;
    background:#fff;border-radius:50%;transition:transform .18s;
  }
  .sw.on{background:var(--working)}
  .sw.on::after{transform:translateX(13px)}
  .themes{display:flex;gap:6px;margin-top:2px}
  .th{
    flex:1;text-align:center;padding:6px 4px;font-size:10.5px;
    background:rgba(255,255,255,.05);border:1px solid transparent;
    border-radius:8px;cursor:pointer;color:var(--dim);transition:.15s;
  }
  .th:hover{background:rgba(255,255,255,.1)}
  .th.on{border-color:var(--working);color:var(--ink);background:rgba(61,220,151,.12)}

  /* ------------------------------------------------------------------ list */
  #list{
    flex:1 1 auto;min-height:0;
    overflow-y:auto;overflow-x:hidden;
    display:flex;flex-direction:column;gap:7px;padding-right:2px;
  }
  #list::-webkit-scrollbar{width:7px}
  #list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px}
  #list::-webkit-scrollbar-track{background:transparent}

  .group{padding:8px 9px 9px}
  .group.enter{animation:rise .3s ease both}
  .group.leave{animation:fade .22s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes fade{to{opacity:0;transform:translateY(-4px)}}

  .group.crowded{
    border-color:rgba(255,107,138,.5);
    box-shadow:0 0 0 1px rgba(255,107,138,.16),0 0 22px -6px rgba(255,107,138,.45);
  }
  .ghead{
    display:flex;align-items:center;gap:6px;padding:0 3px 7px;
    font-size:11px;font-weight:600;letter-spacing:.25px;color:var(--dim);
  }
  .ghead .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ghead .cnt{
    flex:0 0 auto;font-variant-numeric:tabular-nums;font-size:10px;
    background:rgba(255,255,255,.08);border-radius:20px;padding:1px 6px;
  }
  .group.crowded .cnt{background:rgba(255,107,138,.2);color:#ffb3c4}

  .warn{
    display:flex;align-items:center;gap:5px;margin:0 1px 7px;padding:5px 8px;
    background:rgba(255,107,138,.12);border:1px solid rgba(255,107,138,.28);
    border-radius:8px;font-size:10.5px;color:#ffb3c4;line-height:1.35;
  }

  /* --------------------------------------------------------------- bubbles */
  .bubbles{display:flex;flex-direction:column;gap:5px}
  .bub{
    position:relative;display:flex;align-items:flex-start;gap:7px;
    padding:6px 9px 7px 7px;border-radius:10px;
    background:rgba(255,255,255,.045);border:1px solid transparent;
    cursor:pointer;transition:background .16s,border-color .16s,transform .1s;
  }
  body[data-theme=pixel] .bub{border-radius:2px}
  .bub:hover{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.14)}
  .bub:active{transform:scale(.985)}
  .bub.enter{animation:rise .3s ease both}
  .bub.leave{animation:fade .22s ease both}
  .bub.flash{animation:flash .5s ease}
  @keyframes flash{0%,100%{background:rgba(255,255,255,.045)}40%{background:rgba(94,179,255,.28)}}

  /* ---------------------------------------------------------- little ghosts */
  .mini,.sw-g{--eye:#12141a}
  body[data-theme=minimal] .mini,body[data-theme=minimal] .sw-g{--eye:transparent}
  .mini svg,.sw-g svg{width:100%;height:100%;overflow:visible;display:block}
  .mb{transition:fill .45s ease,stroke .45s ease;fill:var(--fill-sleeping);
      stroke:var(--sleeping);stroke-width:1.5;stroke-linejoin:round}
  .mface ellipse{fill:var(--eye)}
  .mblush{fill:var(--blush)!important;opacity:.6}
  .msleep path{stroke:var(--eye);stroke-width:1.1;fill:none;stroke-linecap:round}
  body[data-theme=minimal] .mblush{opacity:0}
  .mface{opacity:1;transition:opacity .3s}
  .msleep{opacity:0;transition:opacity .3s}
  [data-st=sleeping] .mface{opacity:0}
  [data-st=sleeping] .msleep{opacity:1}

  .mini{flex:0 0 auto;width:17px;height:19px;margin-top:1px}
  .bub[data-s=working]  .mini{animation:bob 1.5s ease-in-out infinite}
  .bub[data-s=waiting]  .mini{animation:bob .8s ease-in-out infinite}
  .bub[data-s=replied]  .mini{animation:bob 3s ease-in-out infinite}
  .bub[data-s=sleeping] .mini{opacity:.5}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}

  .txt{flex:1;min-width:0}
  .nme{font-size:12px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bub[data-s=sleeping] .nme{color:#aab2be}
  .act{font-size:10.5px;color:var(--dim);margin-top:1px;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bub[data-s=waiting] .act{color:var(--waiting)}
  .ago{flex:0 0 auto;font-size:10px;color:var(--faint);margin-top:3px;
       font-variant-numeric:tabular-nums}

  .bub[data-forgotten="1"] .ago{color:var(--crowded)}
  .kill{
    flex:0 0 auto;margin-top:1px;font-size:11px;color:var(--faint);
    padding:1px 4px;border-radius:4px;opacity:0;transition:.15s;
  }
  .bub:hover .kill{opacity:1}
  .kill:hover{background:rgba(255,107,138,.22);color:#ffb3c4}
  .kill.armed{opacity:1;background:rgba(255,107,138,.28);color:#fff}

  /* ------------------------------------------------------------- the ghost */
  #stage{flex:0 0 auto;position:relative;height:104px;display:flex;
         align-items:flex-end;justify-content:center}
  #big{overflow:visible;animation:float 3.6s ease-in-out infinite}
  @keyframes float{
    0%,100%{transform:translateY(0) rotate(-1deg)}
    50%{transform:translateY(-9px) rotate(1deg)}
  }
  body[data-mood=working]  #big{animation-duration:1.9s}
  body[data-mood=waiting]  #big{animation-duration:1.1s}
  body[data-mood=sleeping] #big{animation-duration:5.5s}
  #big.hop{animation:hop .62s cubic-bezier(.3,1.4,.5,1)}
  @keyframes hop{0%{transform:translateY(0) scale(1)}
                 35%{transform:translateY(-26px) scale(1.06,.94)}
                 70%{transform:translateY(0) scale(.94,1.06)}
                 100%{transform:translateY(0) scale(1)}}
  #big.spin{animation:twirl .75s ease}
  @keyframes twirl{to{transform:rotate(360deg)}}

  /* body colour and halo: driven by state, no JavaScript involved */
  #big{--ghost:var(--fill-sleeping);--aura:var(--sleeping)}
  body[data-mood=working]  #big{--ghost:var(--fill-working); --aura:var(--working)}
  body[data-mood=waiting]  #big{--ghost:var(--fill-waiting); --aura:var(--waiting)}
  body[data-mood=replied]  #big{--ghost:var(--fill-replied); --aura:var(--replied)}
  body[data-mood=crowded]  #big{--ghost:var(--fill-crowded); --aura:var(--crowded)}

  #body{
    fill:var(--ghost);stroke:var(--outline);stroke-width:2.4;
    stroke-linejoin:round;stroke-linecap:round;
    transition:fill .6s ease,d .55s ease;   /* outfit changes ease in */
  }
  /* the two do-not-disturb cuts */
  #body.reverse{fill:#15181f;stroke:#3a4150}
  body[data-shape=reverse] .eye{fill:#f4f6fa}
  body[data-shape=reverse] .blushc,body[data-shape=reverse] #mouth{opacity:0}
  #body.invisible{fill:none;stroke-dasharray:5 4;opacity:.55}
  body[data-shape=invisible] .face{opacity:.4}
  /* trims and ruffles */
  #deco{fill:none;stroke:var(--outline);stroke-width:1.5;
        stroke-linecap:round;opacity:.75;color:var(--outline)}

  /* Elastic overshoot when the cut changes: it stretches past its resting
     size and springs back. The origin sits at the top, so the head stays
     put and the body does the stretching — squash and stretch, cartoon style. */
  #shape{transform-box:view-box;transform-origin:42px 24px}
  #shape.stretch{animation:stretchIn .9s cubic-bezier(.22,.9,.3,1.2) both}
  @keyframes stretchIn{
    0%  {transform:scaleY(1)    scaleX(1)}
    35% {transform:scaleY(1.26) scaleX(.9)}
    62% {transform:scaleY(.94)  scaleX(1.05)}
    82% {transform:scaleY(1.04) scaleX(.98)}
    100%{transform:scaleY(1)    scaleX(1)}
  }
  /* other outfit changes only get a small twitch */
  #shape.pop{animation:popIn .45s ease both}
  @keyframes popIn{
    0%  {transform:scaleY(1)    scaleX(1)}
    45% {transform:scaleY(1.07) scaleX(.96)}
    100%{transform:scaleY(1)    scaleX(1)}
  }
  /* three in a trench coat: the face rides high, the other two live in the deco */
  body[data-shape=trench] .blushc{opacity:0}
  body[data-shape=trench] #eyes{transform:translateY(-8px)}
  body[data-shape=trench] #mouth{opacity:0}
  #halo{fill:var(--aura);opacity:.20;transition:fill .6s ease}
  .blushc{fill:var(--blush);opacity:.55}
  .eye{transition:all .4s ease}
  #mouth{transition:d .35s ease, fill .35s ease}

  /* expressions: happy eyes when it has replied, shut when asleep */
  .eyearc,.eyeline{
    display:none;fill:none;stroke:var(--outline);
    stroke-width:2.4;stroke-linecap:round;
  }
  body[data-mood=replied]  .eye,
  body[data-mood=replied]  .shine{display:none}
  body[data-mood=replied]  .eyearc{display:block}
  body[data-mood=sleeping] .eye,
  body[data-mood=sleeping] .shine{display:none}
  body[data-mood=sleeping] .eyeline{display:block}
  body[data-theme=pixel] .eyearc,body[data-theme=pixel] .eyeline{display:none!important}
  /* rosier cheeks when it's pleased */
  body[data-mood=replied] .blushc{opacity:.8}
  .blink{animation:blink 4.3s infinite}
  @keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
  #mouth{transition:d .35s ease}

  /* minimal: no face, no cheeks, thin outline */
  body[data-theme=minimal] .face,
  body[data-theme=minimal] #skin{opacity:0}
  body[data-theme=minimal] #body{stroke-width:1.6;fill-opacity:.85}
  body[data-theme=minimal] #halo{opacity:.10}
  /* pixel: square eyes instead of round ones */
  .eyepx{display:none;fill:var(--outline)}
  body[data-theme=pixel] .eye,body[data-theme=pixel] .shine{display:none}
  body[data-theme=pixel] .eyepx{display:block}
  body[data-theme=pixel] #body{stroke-width:2.8}
  body[data-theme=pixel] #halo{opacity:.13}

  /* mic on: it hums along. camera on: red carpet */
  #eyes{transition:transform .12s ease-out}
  .micprop{animation:micsway 1.8s ease-in-out infinite;transform-origin:62px 62px}
  @keyframes micsway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  .notes text{animation:notefly 2.6s ease-out infinite}
  .notes text:nth-child(2){animation-delay:1.3s}
  @keyframes notefly{
    0%{opacity:0;transform:translate(0,0) scale(.6)}
    30%{opacity:1}
    100%{opacity:0;transform:translate(-8px,-22px) scale(1.1)}
  }
  .spot{animation:spotsweep 4.5s ease-in-out infinite;transform-origin:42px 0}
  @keyframes spotsweep{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  body[data-mic="1"] #big{animation-duration:1.4s}

  /* animated outfit accessories */
  .floaty{animation:floaty 3.2s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateY(0);opacity:.9}
                    50%{transform:translateY(-5px);opacity:1}}
  .twinkle{animation:twinkle 2.4s ease-in-out infinite;transform-origin:67px 25px}
  @keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8)}
                     50%{opacity:1;transform:scale(1.15)}}

  #zzz{opacity:0;transition:opacity .5s}
  body[data-mood=sleeping] #zzz{opacity:1}
  #zzz text{animation:riseZ 3.4s ease-out infinite}
  #zzz text:nth-child(2){animation-delay:1.15s}
  #zzz text:nth-child(3){animation-delay:2.3s}
  @keyframes riseZ{
    0%{opacity:0;transform:translate(0,0) scale(.6)}
    25%{opacity:.9}
    100%{opacity:0;transform:translate(9px,-24px) scale(1.15)}
  }
  #bang{opacity:0;transition:opacity .35s}
  body[data-mood=waiting] #bang{opacity:1;animation:bounce .95s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  #swirl{opacity:0;transition:opacity .35s}
  body[data-mood=crowded] #swirl{opacity:1}
  #swirl g{animation:spin 3.1s linear infinite;transform-origin:42px 8px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ------------------------------------------------------- the ghost swarm */
  #swarm{position:absolute;inset:0;pointer-events:none}
  .sw-g{
    position:absolute;width:15px;height:17px;
    animation:drift var(--dur,5s) ease-in-out infinite;
    animation-delay:var(--del,0s);
    transition:left .9s ease,top .9s ease,opacity .5s ease;
  }
  .sw-g.asleep{opacity:.42;animation-duration:9s}
  @keyframes drift{
    0%,100%{transform:translate(0,0)}
    33%{transform:translate(3px,-6px)}
    66%{transform:translate(-3px,-3px)}
  }

  #say{
    position:absolute;bottom:74px;left:50%;transform:translateX(-50%);
    background:var(--panel);border:1px solid var(--line);
    backdrop-filter:blur(22px);border-radius:11px;padding:5px 11px;
    font-size:11px;white-space:nowrap;opacity:0;transition:opacity .4s;
    pointer-events:none;z-index:3;
  }
  #say.on{opacity:1}

  #empty{text-align:center;color:var(--dim);font-size:11.5px;padding:22px 10px;line-height:1.6}

  /* ---------------------------------------------------------- collapsed rail
     Folded, the whole column becomes a thin strip on the chosen side: the
     counters and a little ghost, nothing else. The window itself never moves
     or resizes — everything else is simply hidden and the hit rectangles
     shrink to the rail, so the rest of the screen goes back to the app below. */
  :root{--fold-x:14px}
  body[data-side=left]{--fold-x:-14px}

  #rail{
    display:none;flex:0 0 auto;flex-direction:column;align-items:center;
    width:28px;padding:8px 0 9px;gap:7px;align-self:flex-end;
    cursor:pointer;transition:border-color .3s,box-shadow .3s;
  }
  body[data-side=left] #rail{align-self:flex-start}
  #rail:hover{border-color:rgba(255,255,255,.22)}
  #rail.alert{
    border-color:rgba(255,181,71,.55);
    box-shadow:0 0 18px -5px rgba(255,181,71,.55);
  }
  #railTally{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    font-size:9.5px;line-height:1;font-variant-numeric:tabular-nums;
  }
  #railTally span{display:flex;flex-direction:column;align-items:center;gap:2px}
  #railTally i{width:6px;height:6px;border-radius:50%;background:currentColor;font-style:normal}
  body[data-mood=working] #railGhost{animation:bob 1.5s ease-in-out infinite}
  body[data-mood=waiting] #railGhost{animation:bob .8s ease-in-out infinite}
  body[data-mood=replied] #railGhost{animation:bob 3s ease-in-out infinite}
  body[data-mood=sleeping] #railGhost{opacity:.55}

  body.rail #grip,body.rail #panel,body.rail #list,body.rail #stage,body.rail #grab{display:none}
  body.rail #rail{display:flex;animation:railIn .3s cubic-bezier(.2,1.3,.4,1) both}
  @keyframes railIn{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}

  /* the column slides towards its side on the way out, and back on the way in */
  body.folding #grip,body.folding #panel,body.folding #list,body.folding #stage{
    animation:foldOut .2s ease both}
  body.unfolding #grip,body.unfolding #panel,body.unfolding #list,body.unfolding #stage{
    animation:foldIn .28s ease both}
  @keyframes foldOut{to{opacity:0;transform:translateX(var(--fold-x)) scale(.97)}}
  @keyframes foldIn{from{opacity:0;transform:translateX(var(--fold-x)) scale(.97)}}

  /* resize handle */
  #grab{
    position:fixed;right:2px;bottom:2px;width:16px;height:16px;
    cursor:nwse-resize;opacity:.3;transition:opacity .15s;z-index:5;
  }
  #grab:hover{opacity:.85}
  #grab::after{
    content:"";position:absolute;right:3px;bottom:3px;width:8px;height:8px;
    border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);
    border-radius:0 0 3px 0;
  }
</style>
</head>
<body data-mood="sleeping" data-theme="soft">

  <div id="grip" class="card">
    <span class="ttl">PEEKABOO</span>
    <div class="spacer"></div>
    <div id="tally"></div>
    <span class="ico" id="fold" title="Fold it down to the side">›</span>
    <span class="ico" id="dnd"  title="Do not disturb">☾</span>
    <span class="ico" id="gear" title="Settings">⚙</span>
    <span class="ico" id="close" title="Close">✕</span>
  </div>

  <div id="panel" class="card">
    <div class="sec">Placement</div>
    <div class="row"><label>Display</label>
      <select id="screenSel"><option value="-1">main</option></select></div>
    <div class="row"><label>Arrangement</label>
      <select id="layoutSel">
        <option value="full">full column</option>
        <option value="tophalf">top half</option>
        <option value="half">bottom half</option>
        <option value="free">free (drag it)</option>
      </select></div>

<script src="wardrobe.js"></script>
<script>
"use strict";

// silhouettes and outfits live in wardrobe.js, shared with the gallery
const {WARDROBE, pickShape, SKINS, skinForDate, flowerCrown} = window.Wardrobe;

const COLOR = {working:'var(--working)',waiting:'var(--waiting)',replied:'var(--replied)',
               sleeping:'var(--sleeping)',crowded:'var(--crowded)'};
/* Mouths: the kitten "ω" from the stickers, not a round hole.
   `fill` tells open mouths (a full grin) apart from drawn strokes. */
const MOUTH = {
  working:  {d:'M38 53.5 q2 2.6 4 0 q2 2.6 4 0', fill:'none'},   // focused ω
  waiting:  {d:'M39.6 53.4 q2.4 -1.6 4.8 0 q-0.6 3.4 -2.4 3.4 q-1.8 0 -2.4 -3.4 z',
             fill:'var(--outline)'},                              // small open mouth
  replied:  {d:'M36.5 52.6 q5.5 7 11 0 z', fill:'var(--outline)'},// big happy grin
  sleeping: {d:'M39.6 54.4 q2.4 1.4 4.8 0', fill:'none'},         // soft line
  crowded:  {d:'M37.4 55.4 q2.3 -2.6 4.6 0 q2.3 2.6 4.6 0', fill:'none'}, // worried little wave
};
const LABEL = {working:'working',waiting:'waiting for you',replied:'replied',sleeping:'asleep'};

const native = window.webkit?.messageHandlers?.app;
const send = m => native && native.postMessage(m);
const $ = s => document.querySelector(s);

/** Little ghost, inlined: document CSS can't reach inside a <use> shadow tree. */
function miniSVG(){
  return `<svg viewBox="0 0 22 24">
    <path class="mb" d="M3 12 A8 8 0 0 1 19 12 L19 17 Q17 22 15 17 Q13 22 11 17 Q9 22 7 17 Q5 22 3 17 Z"/>
    <g class="mface">
      <ellipse cx="8" cy="12" rx="1.7" ry="2.1"/><ellipse cx="14" cy="12" rx="1.7" ry="2.1"/>
      <ellipse class="mblush" cx="4.8" cy="14.6" rx="1.5" ry="1"/>
      <ellipse class="mblush" cx="17.2" cy="14.6" rx="1.5" ry="1"/>
    </g>
    <g class="msleep">
      <path d="M6.4 12 Q8 13.6 9.6 12"/><path d="M12.4 12 Q14 13.6 15.6 12"/>
    </g>
  </svg>`;
}

/** Tints a little ghost and shuts its eyes if it's asleep. */
const MINI_FILL = {working:'var(--fill-working)',waiting:'var(--fill-waiting)',
                   replied:'var(--fill-replied)',sleeping:'var(--fill-sleeping)',
                   crowded:'var(--fill-crowded)'};
function paintMini(host, state){
  if (host.dataset.st === state) return;
  host.dataset.st = state;
  const body = host.querySelector('.mb');
  if (body){
    body.style.fill = MINI_FILL[state] || MINI_FILL.sleeping;
    body.style.stroke = COLOR[state];
  }
}

// -------------------------------------------------------- outfits and shapes
let shownSkin = null;
function renderSkin(){
  const choice = settings.skin ?? 'auto';
  const want = choice === 'auto' ? skinForDate(new Date())
             : choice === 'off'  ? ''
             : choice;
  if (want === shownSkin) return;
  shownSkin = want;
  const g = $('#skin');
  g.innerHTML = SKINS[want]?.svg || '';
  const crown = g.querySelector('#crown');
  if (crown) crown.innerHTML = flowerCrown();
}

/** Wears a silhouette from the wardrobe, with the right flourish for the change. */
let wornShape = null;
function wear(name){
  if (name === wornShape) return;
  const first = wornShape === null;      // no theatrics on first paint
  wornShape = name;

  const s = WARDROBE[name] || WARDROBE.regular;
  setAttr($('#body'), 'd', s.d);
  setAttr($('#body'), 'class', s.cls || '');
  $('#deco').innerHTML = s.deco || '';
  document.body.dataset.shape = name;

  if (first) return;
  // going maxi stretches past its size and springs back; every other
  // outfit change just gets a twitch
  const g = $('#shape');
  const kind = (name === 'maxi') ? 'stretch' : 'pop';
  g.classList.remove('stretch', 'pop');
  void g.getBoundingClientRect();         // force the animation to restart
  g.classList.add(kind);
  setTimeout(() => g.classList.remove(kind), kind === 'stretch' ? 950 : 500);
}

function esc(s){
  return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function ago(s){
  if (s < 60) return s + 's';
  if (s < 3600) return Math.round(s/60) + 'm';
  if (s < 86400) return Math.round(s/3600) + 'h';
  return Math.round(s/86400) + 'g';
}
/** Only writes when the value actually changed: this is what kills the flicker. */
function setText(el, v){ if (el && el.textContent !== v) el.textContent = v; }
function setAttr(el, k, v){ if (el && el.getAttribute(k) !== String(v)) el.setAttribute(k, String(v)); }

// --------------------------------------------------------------- the ghost
let sayTimer = null;
function say(msg, ms = 3600){
  const el = $('#say');
  setText(el, msg);
  el.classList.add('on');
  clearTimeout(sayTimer);
  sayTimer = setTimeout(() => el.classList.remove('on'), ms);
}

function react(kind){
  if (!settings.personality) return;
  const g = $('#big');
  g.classList.remove('hop','spin');
  void g.offsetWidth;             // force the animation to restart
  g.classList.add(kind);
  setTimeout(() => g.classList.remove(kind), 800);
}

const POKES = ['boo!','hey!','hi','over here','ooh!','peekaboo!'];
let lastData = null;

/** Clicking the ghost: if something is waiting it takes you there, otherwise it plays. */
$('#stage').addEventListener('click', async ev => {
  if (ev.target.closest('#swarm')) return;
  const waiting = (lastData?.groups || []).flatMap(g => g.sessions)
                    .find(s => s.state === 'waiting');
  if (waiting){
    react('hop');
    say(`Taking you to “${waiting.name}”`, 2200);
    await post('/api/focus', {pid: waiting.pid});
    return;
  }
  react(Math.random() < .3 ? 'spin' : 'hop');
  if (settings.personality) say(POKES[Math.floor(Math.random()*POKES.length)], 1600);
});

// ----------------------------------------------------------- gaze and staging
/** Called by the native shell on every mouse move, even outside the window. */
window.lookAt = (x, y) => {
  const eyes = $('#eyes');
  if (!eyes) return;
  if (!(settings.eyesFollow ?? true)){ eyes.removeAttribute('transform'); return; }
  const svg = $('#big'), r = svg.getBoundingClientRect();
  if (!r.width) return;
  const unit = 84 / r.width;                       // screen px → drawing units
  const cx = r.left + r.width / 2, cy = r.top + r.height * 0.46;
  const dx = (x - cx) * unit, dy = (y - cy) * unit;
  const d = Math.hypot(dx, dy) || 1;
  const reach = Math.min(2.8, d / 12);
  eyes.setAttribute('transform',
    `translate(${(dx / d * reach).toFixed(2)} ${(dy / d * reach * .75).toFixed(2)})`);
};

/** Mic on → it sings. Camera on → red carpet. */
const PROPS = {
  mic: `
    <g class="micprop">
      <rect x="60" y="46" width="4" height="20" rx="2" fill="#3a3f4a"
            stroke="var(--outline)" stroke-width="1.4"/>
      <ellipse cx="62" cy="43" rx="6" ry="7" fill="#6b7280"
               stroke="var(--outline)" stroke-width="1.6"/>
      <path d="M57 40 h10 M57 43 h10 M57 46 h10" stroke="var(--outline)"
            stroke-width="1" opacity=".55"/>
    </g>
    <g class="notes">
      <text x="12" y="34" font-size="11" fill="var(--replied)">♪</text>
      <text x="20" y="24" font-size="9" fill="var(--working)">♫</text>
    </g>`,
  cam: `
    <g class="spot">
      <path d="M2 0 L26 84 L2 84 Z" fill="#fff6cc" opacity=".16"/>
      <path d="M82 0 L58 84 L82 84 Z" fill="#fff6cc" opacity=".16"/>
    </g>
    <rect x="0" y="74" width="84" height="10" fill="#c0263c" opacity=".75"/>
    <g class="twinkle">
      <path d="M14 20 l1.4 3.6 3.6 1.4 -3.6 1.4 -1.4 3.6 -1.4 -3.6 -3.6 -1.4 3.6 -1.4 z"
            fill="#ffe08a"/>
    </g>
    <g class="twinkle" style="animation-delay:.8s">
      <path d="M70 30 l1.2 3 3 1.2 -3 1.2 -1.2 3 -1.2 -3 -3 -1.2 3 -1.2 z" fill="#ffe08a"/>
    </g>`,
};

let devMic = false, devCam = false;
window.setDevices = (mic, cam) => {
  if (mic === devMic && cam === devCam) return;
  devMic = mic; devCam = cam;
  document.body.dataset.mic = mic ? '1' : '0';
  document.body.dataset.cam = cam ? '1' : '0';
  $('#props').innerHTML = (cam ? PROPS.cam : '') + (mic ? PROPS.mic : '');
  if (settings.personality){
    if (cam) say('In the spotlight ✨', 3000);
    else if (mic) say('Testing, testing… 🎤', 3000);
  }
};

/** List of displays, pushed over by the native shell. */
window.setScreens = list => {
  const sel = $('#screenSel');
  const want = String(settings.screen ?? -1);
  sel.innerHTML = '<option value="-1">main (automatic)</option>' +
    list.map(s => `<option value="${s.i}">${esc(s.name)} — ${s.size}${s.main ? ' ·' : ''}</option>`).join('');
  sel.value = want;
};

// -------------------------------------------------------------------- the swarm
/** Fixed slots by index, so the ghosts don't hop about on every refresh. */
function swarmSpot(i, n){
  const cols = Math.min(n, 9);
  const col = i % cols, row = Math.floor(i / cols);
  const spread = 78;
  const x = 50 + (col - (cols - 1) / 2) * (spread / Math.max(cols, 1));
  const y = 6 + row * 26 + (col % 2 ? 7 : 0);
  return [x, y];
}

const swarmNodes = new Map();       // pid -> elemento
function renderSwarm(all){
  const host = $('#swarm');
  if (!settings.swarm){
    if (swarmNodes.size){ host.innerHTML = ''; swarmNodes.clear(); }
    return;
  }
  const show = all.slice(0, 18);
  const seen = new Set();

  show.forEach((s, i) => {
    seen.add(s.pid);
    let el = swarmNodes.get(s.pid);
    if (!el){
      el = document.createElement('div');
      el.className = 'sw-g';
      el.style.setProperty('--dur', (4.2 + (i % 5) * .8) + 's');
      el.style.setProperty('--del', ((i % 7) * .35) + 's');
      el.innerHTML = miniSVG();
      host.appendChild(el);
      swarmNodes.set(s.pid, el);
    }
    const [x, y] = swarmSpot(i, show.length);
    if (el.style.left !== x + '%'){ el.style.left = x + '%'; el.style.top = y + 'px'; }
    paintMini(el, s.state);
    el.classList.toggle('asleep', s.state === 'sleeping');
  });

  for (const [pid, el] of swarmNodes)
    if (!seen.has(pid)){ el.remove(); swarmNodes.delete(pid); }
}

// ------------------------------------------------------------- collapsed rail
$('#railGhost').innerHTML = miniSVG();

/** The rail carries the same tally as the bar, stacked, plus one ghost in the
 *  colour of the mood. Amber ring when something is waiting for you. */
function renderRail(d){
  const c = d.counts || {};
  const want = ['working','waiting','replied','sleeping'].filter(k => c[k])
    .map(k => `<span class="t-${k}"><i></i>${c[k]}</span>`).join('');
  const t = $('#railTally');
  if (t.innerHTML !== want) t.innerHTML = want;
  $('#rail').classList.toggle('alert', (c.waiting || 0) > 0);
  paintMini($('#railGhost'), d.mood);
}

/** Reflects the saved state. Idempotent: it runs on every poll. */
function applyCollapsed(){
  const want = !!settings.collapsed;
  if (document.body.classList.contains('rail') === want) return;
  document.body.classList.toggle('rail', want);
  requestAnimationFrame(sendHitRects);
}

/** Folds and unfolds with the little slide. The state is saved, so it survives
 *  a restart; the window is never moved or resized. */
let foldTimer = null;
function toggleFold(){
  const to = !settings.collapsed;
  const b = document.body;
  clearTimeout(foldTimer);
  b.classList.remove('folding','unfolding');
  void b.offsetWidth;                     // restart the animation
  b.classList.add(to ? 'folding' : 'unfolding');
  foldTimer = setTimeout(() => b.classList.remove('folding','unfolding'), to ? 220 : 300);
  // folding: let the column slide out first, then swap in the rail
  if (to){ $('#panel').classList.remove('open'); setTimeout(() => pushSettings({collapsed:true}), 190); }
  else pushSettings({collapsed:false});
}

$('#fold').onclick = toggleFold;

// A drag on the rail moves the window, so only count it as a click if the
// mouse stayed put.
let railDown = null;
$('#rail').addEventListener('mousedown', ev => { railDown = [ev.screenX, ev.screenY]; });
$('#rail').addEventListener('click', ev => {
  if (railDown && Math.hypot(ev.screenX - railDown[0], ev.screenY - railDown[1]) > 4) return;
  toggleFold();
});

// ------------------------------------------------------------ flicker-free list
const groupNodes = new Map();       // progetto -> {el, bubs:Map}

function bubbleHTML(){
  return `<div class="mini">${miniSVG()}</div>
          <div class="txt"><div class="nme"></div><div class="act"></div></div>
          <div class="ago"></div><div class="kill" title="Close this session">✕</div>`;
}

function updateBubble(el, s){
  if (el.dataset.s !== s.state){
    el.dataset.s = s.state;
    el.title = LABEL[s.state] + (s.guessed ? ' (guess)' : '') + ' — click to open its terminal';
    paintMini(el.querySelector('.mini'), s.state);
  }
  el.dataset.forgotten = s.forgotten ? '1' : '0';
  el.dataset.pid = s.pid;
  setText(el.querySelector('.nme'), s.name);
  setText(el.querySelector('.act'), s.activity || '');
  setText(el.querySelector('.ago'), ago(s.idleFor));
}

function renderList(d){
  const host = $('#list');
  const groups = d.groups || [];

  if (!groups.length){
    if (!host.querySelector('#empty')){
      host.innerHTML = '<div id="empty">No Claude sessions running.<br>Open a terminal and let\'s begin.</div>';
      groupNodes.clear();
    }
    return;
  }
  const stale = host.querySelector('#empty');
  if (stale) stale.remove();

  const seen = new Set();
  groups.forEach((g, gi) => {
    seen.add(g.project);
    let rec = groupNodes.get(g.project);

    if (!rec){
      const el = document.createElement('div');
      el.className = 'group card enter';
      el.innerHTML = `<div class="ghead"><span class="nm"></span><span class="cnt"></span></div>
                      <div class="warnbox"></div><div class="bubbles"></div>`;
      host.appendChild(el);
      setTimeout(() => el.classList.remove('enter'), 400);
      rec = {el, bubs:new Map()};
      groupNodes.set(g.project, rec);
    }
    // reorder groups without rebuilding anything
    if (host.children[gi] !== rec.el) host.insertBefore(rec.el, host.children[gi] || null);

    rec.el.classList.toggle('crowded', !!g.crowded);
    const nm = rec.el.querySelector('.nm');
    setText(nm, g.project);
    if (nm.title !== g.cwd) nm.title = g.cwd;
    setText(rec.el.querySelector('.cnt'), `${g.awake}/${g.sessions.length}`);

    const wb = rec.el.querySelector('.warnbox');
    const want = g.crowded
      ? `<div class="warn">⚠︎ ${g.awake} awake here — past ${d.crowdLimit} they start colliding</div>` : '';
    if (wb.innerHTML !== want) wb.innerHTML = want;

    // bubbles
    const box = rec.el.querySelector('.bubbles');
    const alive = new Set();
    g.sessions.forEach((s, si) => {
      alive.add(s.pid);
      let b = rec.bubs.get(s.pid);
      if (!b){
        b = document.createElement('div');
        b.className = 'bub enter';
        b.innerHTML = bubbleHTML();
        box.appendChild(b);
        setTimeout(() => b.classList.remove('enter'), 400);
        rec.bubs.set(s.pid, b);
      }
      if (box.children[si] !== b) box.insertBefore(b, box.children[si] || null);
      updateBubble(b, s);
    });
    for (const [pid, b] of rec.bubs)
      if (!alive.has(pid)){ drop(b); rec.bubs.delete(pid); }
  });

  for (const [name, rec] of groupNodes)
    if (!seen.has(name)){ drop(rec.el); groupNodes.delete(name); }
}

function drop(el){
  el.classList.add('leave');
  setTimeout(() => el.remove(), 260);
}

// -------------------------------------------------------------------- settings
let settings = {theme:'soft', swarm:true, personality:true,
                notifications:{}, autostart:false, alwaysOnTop:true};

function get(obj, path){ return path.split('.').reduce((o,k) => o?.[k], obj); }
function setPath(obj, path, v){
  const ks = path.split('.'), last = ks.pop();
  ks.reduce((o,k) => (o[k] ??= {}), obj)[last] = v;
}

function paintSettings(){
  document.body.dataset.theme = settings.theme || 'soft';
  document.body.dataset.side = settings.side || 'right';
  setText($('#fold'), (settings.side || 'right') === 'left' ? '‹' : '›');
  applyCollapsed();
  document.querySelectorAll('.th').forEach(t =>
    t.classList.toggle('on', t.dataset.theme === settings.theme));
  document.querySelectorAll('.sw[data-key]').forEach(sw =>
    sw.classList.toggle('on', !!get(settings, sw.dataset.key)));
  document.querySelectorAll('input[data-key]').forEach(inp => {
    const v = get(settings, inp.dataset.key);
    if (document.activeElement !== inp && inp.value !== String(v)) inp.value = v;
  });
  const pick = (id, v) => { const e = $(id); if (e && e.value !== String(v)) e.value = String(v); };
  pick('#skinSel',   settings.skin   ?? 'auto');
  pick('#layoutSel', settings.layout ?? 'full');
  pick('#sideSel',   settings.side   ?? 'right');
  pick('#screenSel', settings.screen ?? -1);
  pick('#hotkeySel', settings.hotkey ?? 'opt-cmd-B');
  if (!(settings.eyesFollow ?? true)) $('#eyes')?.removeAttribute('transform');

  const pct = Math.round((settings.fadeOpacity ?? .32) * 100);
  const fr = $('#fadeRange');
  if (fr && document.activeElement !== fr && fr.value !== String(pct)) fr.value = pct;
  setText($('#fadeVal'), pct + '%');

  const auto = skinForDate(new Date());
  setText($('#skinHint'), (settings.skin ?? 'auto') === 'auto'
    ? (auto ? `Right now: ${SKINS[auto].label}` : 'Right now: no outfit')
    : '');
}

async function pushSettings(patch){
  settings = {...settings, ...patch};
  paintSettings();
  send({type:'settings', settings});
  try{
    const r = await fetch('/api/settings', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(patch)
    });
    settings = await r.json();
    paintSettings();
  }catch(e){ /* we'll try again next round */ }
}

document.querySelectorAll('.sw[data-key]').forEach(sw => {
  sw.onclick = () => {
    const key = sw.dataset.key;
    const patch = {};
    setPath(patch, key, !get(settings, key));
    pushSettings(patch);
  };
});
document.querySelectorAll('input[data-key]').forEach(inp => {
  inp.onchange = () => {
    const n = Number(inp.value);
    if (!Number.isFinite(n) || n < 1) return paintSettings();
    const patch = {}; setPath(patch, inp.dataset.key, n);
    pushSettings(patch);
  };
});
document.querySelectorAll('.th').forEach(t => {
  t.onclick = () => pushSettings({theme: t.dataset.theme});
});
$('#skinSel').onchange   = e => pushSettings({skin: e.target.value});
// the slider fires constantly: update the label live, save when the gesture ends
$('#fadeRange').oninput  = e => setText($('#fadeVal'), e.target.value + '%');
$('#fadeRange').onchange = e => pushSettings({fadeOpacity: Number(e.target.value) / 100});
$('#screenSel').onchange = e => pushSettings({screen: Number(e.target.value)});
$('#layoutSel').onchange = e => pushSettings({layout: e.target.value});
$('#sideSel').onchange   = e => pushSettings({side: e.target.value});
$('#hotkeySel').onchange = e => pushSettings({hotkey: e.target.value});

$('#gear').onclick = () => { $('#panel').classList.toggle('open'); sendHitRects(); };
$('#close').onclick = () => send({type:'quit'});

/** The rectangles where something is actually drawn: outside them a click
 *  falls through to the app below, so the window stops behaving like a box. */
let lastRects = '';
function sendHitRects(){
  const sel = document.body.classList.contains('rail')
    ? ['#rail']
    : ['#grip', '#panel.open', '.group', '#big', '#grab', '#say.on'];
  const rects = [];
  for (const s of sel){
    for (const el of document.querySelectorAll(s)){
      const r = el.getBoundingClientRect();
      if (r.width > 0 && r.height > 0)
        rects.push({x:Math.round(r.left), y:Math.round(r.top),
                    w:Math.round(r.width), h:Math.round(r.height)});
    }
  }
  const key = JSON.stringify(rects);
  if (key === lastRects) return;          // don't send the same thing twice
  lastRects = key;
  send({type:'hitrects', rects});
}
$('#list').addEventListener('scroll', sendHitRects);

// Resizing also changes the cut (tall → maxi), so it has to be recomputed
// right away, otherwise the flourish would land up to two seconds late.
let resizeTimer = null;
window.addEventListener('resize', () => {
  sendHitRects();
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (lastData) wear(pickShape(lastData, {height: window.innerHeight,
                                            dndLook: settings.dndLook}));
  }, 120);                                 // once resizing has settled
});
$('#dnd').onclick = () => {
  const on = !$('#dnd').classList.contains('on');
  pushSettings({dndUntil: on ? Math.floor(Date.now()/1000) + 3600 : 0});
  say(on ? 'Quiet for an hour' : 'Back on duty', 2400);
};

// ---------------------------------------------------------------- interactions
$('#list').addEventListener('click', async ev => {
  const bub = ev.target.closest('.bub');
  if (!bub) return;
  const pid = Number(bub.dataset.pid);

  // ✕ closes the session, but only on the second click
  const kill = ev.target.closest('.kill');
  if (kill){
    ev.stopPropagation();
    if (!kill.classList.contains('armed')){
      kill.classList.add('armed');
      kill.textContent = 'sure?';
      setTimeout(() => { kill.classList.remove('armed'); kill.textContent = '✕'; }, 3000);
      return;
    }
    await post('/api/close', {pid});
    say('Session closed', 2000);
    return;
  }

  bub.classList.add('flash');
  setTimeout(() => bub.classList.remove('flash'), 500);
  const j = await post('/api/focus', {pid});
  if (j && !j.ok)
    say(/not authoriz|1743|assistive/i.test(j.error || '')
        ? 'Allow it in Settings › Privacy › Automation'
        : 'Terminal not found');
});

async function post(url, body){
  try{
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
                               body: JSON.stringify(body)});
    return await r.json();
  }catch(e){ return null; }
}

// dragging: the bar and the ghost both move the window
for (const id of ['grip','stage','rail']){
  document.getElementById(id).addEventListener('mousedown', ev => {
    if (ev.target.closest('.ico')) return;
    send({type:'dragstart'});
  });
}
$('#grab').addEventListener('mousedown', () => send({type:'resizestart'}));

// ------------------------------------------------------------------ main loop
let lastMood = null, lastWaiting = 0, lastForgotten = 0;

function render(d){
  if (d.settings){ settings = d.settings; paintSettings(); }

  document.body.dataset.mood = d.mood;     // colour, halo and eyes are all CSS
  wear(pickShape(d, {height: window.innerHeight, dndLook: settings.dndLook}));
  renderSkin();
  const m = MOUTH[d.mood] || MOUTH.sleeping;
  setAttr($('#mouth'), 'd', m.d);
  setAttr($('#mouth'), 'fill', m.fill);
  $('#dnd').classList.toggle('on', !!d.dnd);

  const c = d.counts || {};
  const want = ['working','waiting','replied','sleeping'].filter(k => c[k])
    .map(k => `<span class="t-${k}"><i></i>${c[k]}</span>`).join('');
  const tally = $('#tally');
  if (tally.innerHTML !== want) tally.innerHTML = want;

  renderList(d);
  renderSwarm((d.groups || []).flatMap(g => g.sessions));
  renderRail(d);
  lastData = d;
  requestAnimationFrame(sendHitRects);   // after the layout has settled

  // remarks, only when something noteworthy changes
  const w = c.waiting || 0;
  if (w > lastWaiting)
    say(w === 1 ? 'A session is waiting for you' : `${w} sessions are waiting for you`);
  else if (d.mood === 'crowded' && lastMood !== 'crowded')
    say(`Too many sessions on ${d.crowded[0]}`);
  else if (d.forgotten > lastForgotten && d.forgotten > 2 && settings.personality)
    say(`${d.forgotten} sessions forgotten a while ago`);
  else if (d.mood === 'sleeping' && lastMood && lastMood !== 'sleeping')
    say('All quiet');
  lastWaiting = w; lastMood = d.mood; lastForgotten = d.forgotten || 0;
}

async function tick(){
  try{
    const r = await fetch('/api/sessions', {cache:'no-store'});
    render(await r.json());
  }catch(e){ /* the server restarts on its own, we'll retry next round */ }
}
send({type:'ready'});      // ask for displays and device state
tick();
setInterval(tick, 2000);
</script>
